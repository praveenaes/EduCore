version: '3.8'

services:
  # 1. MongoDB Database Service
  mongo:
    image: mongo:latest
    container_name: educore-database
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - educore-network

  # 2. Express Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: educore-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/educore
      - CLIENT_URL=http://localhost:80
      - NODE_ENV=production
      - JWT_SECRET=$JWT_SECRET
      - JWT_ACCESS_EXPIRATION=1m
      - JWT_REFRESH_EXPIRATION=7d
      - RESET_PASS_TOKEN_EXPIRY=5m
      - ADMIN_EMAIL=admin@educore.com
      - ADMIN_PASSWORD=admin123
      - ADMIN_NAME=Admin
      - SMTP_HOST=sandbox.smtp.mailtrap.io
      - SMTP_PORT=2525
      - SMTP_USER=$SMTP_USER
      - SMTP_PASS=$SMTP_PASS
      - AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
      - AWS_REGION=us-east-1
      - AWS_S3_BUCKET=educorephotos
    depends_on:
      - mongo
    networks:
      - educore-network

  # 3. React Frontend Service served via Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: educore-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - educore-network

# Data volumes to keep MongoDB database persistent
volumes:
  mongo-data:

# Internal network allowing container hostname name-resolution
networks:
  educore-network:
    driver: bridge
